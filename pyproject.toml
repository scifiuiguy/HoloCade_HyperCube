[project]
name = "holocade-hypercube"
version = "0.0.1"
description = "Vision and compositing service for HoloCade Cube (Linux target; dev on Windows)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24",
    # OpenCV is pulled in by MediaPipe (opencv-contrib-python). Pin MediaPipe if you need a specific OpenCV line.
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
# NVIDIA Windows/Linux dev: `uv sync --extra cuda` (CUDA 12.4 wheels).
cuda = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
